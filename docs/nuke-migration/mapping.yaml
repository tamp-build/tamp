# Machine-readable projection of the NUKE -> Tamp mapping reference (ADR 0021).
# Prose + context: mapping-reference.md. Consumed by `tamp migrate nuke` (Tamp.Migrate) and by
# agent-guided migration. Validated by tests/Tamp.Migrate.Tests/MappingTests.cs: ids, the closed
# vocabularies below, and every Tamp-side symbol of the in-tree packages (Tamp.Core, Tamp.NetCli,
# Tamp.Components) are checked against the real API by reflection.
#
# Scope: NUKE 8+ (the Serilog era). Validate the NUKE side against the current NUKE release.
#
# ---- Schema 0.2 ----
# rules[]: one per NUKE construct.
#   id        unique, `<category>.<slug>`; stable (reports and TAMP-MIGRATE markers cite it)
#   category  boilerplate | injection | paths | target_dsl | logging | components
#   tier      auto     = applied mechanically, no marker
#             assisted = rewrite (if any) applied AND a marker left for a person to confirm
#             manual   = no rewrite; marker only
#   nuke/tamp display strings (tamp: null = no equivalent)
#   match     what the syntactic rewriter looks for (kind + fields):
#               base_type  {names}               a base-list entry, e.g. `: NukeBuild`
#               attribute  {names}               an attribute on a member or class
#               invocation {names, receiver?}    a call `X.Name(...)` / `Name(...)`; receiver = simple name of X
#               identifier {names}               a non-invoked name (property, type)
#               member     {names}               a member access `x.Name` (not invoked), or a member declared with that name
#               using      {namespace}           a using directive for this namespace or a child of it
#               entrypoint {}                    `Main() => Execute<T>(x => x.Target)`
#               field_invocation {attributes}    a delegate call on a field carrying one of these attributes
#               file       {globs}               a repository file (relative to the repo root)
#   rewrite   (omit for none):
#               keep                             valid Tamp as written
#               rename   {to}                    swap the matched name
#               template {to}                    replace the whole match; placeholders {receiver} {args}
#               remove                           delete the matched node
#               handler  {name}                  code-defined transform; names are listed in `handlers`
#   marker    the TAMP-MIGRATE text (required for assisted/manual; never on auto)
#   note      context for people; not emitted
#   verify    Tamp-side symbols, `Namespace.Type` or `Namespace.Type.Member`, checked by reflection
#
# tools.<family>: NUKE `{Class}.{Verb}(s => s.Setting(...))` -> Tamp `{facade}.{Verb}(s => ...)`.
#   verbs:    NUKE method -> Tamp verb (string), or {to, tier}; tier defaults to the family tier
#   settings: NUKE setting -> {to, args?, tier} (rename, optional fixed args) or {template, tier}
#   in_tree:  true when the wrapper builds in this repo; its verbs and settings are verified
#
# namespaces: NUKE namespace -> the Tamp namespace whose types replace it, for the `usings` handler.
#   Tool namespaces come from tools.<family>.nuke_namespace and Nuke.Components from the components
#   rule; a Nuke namespace in neither is left in place with a marker.
#
# gaps: NUKE surface with no Tamp equivalent, surfaced by the inventory before any rewrite.

version: "0.2"
nuke: ">=8.0"
source: docs/nuke-migration/mapping-reference.md
adr: docs/adr/0021-nuke-to-tamp-migration.md

handlers:
  entrypoint-default: "Rewrite Main to `public static int Main(string[] args) => Execute<T>(args);` and add `.Default()` to the target Execute selected."
  usings: "Drop `using Nuke.*`; add `using Tamp;` plus one using per tool family / component namespace the build uses. A Nuke namespace with no mapping is left with a marker."
  scaffold-bootstrap: "Generate tamp.sh / tamp.cmd and the dotnet-tamp tool-manifest entry (the `tamp init` scaffold); NUKE's scripts and .nuke/ are left for the user to delete."
  configuration-class: "Remove the `nuke :setup` template's `class Configuration : Enumeration` (just Debug and Release) so the build uses Tamp's built-in Configuration; any other Enumeration is marked."
  build-project: "Rewrite the NUKE build project in place: drop Nuke.* references and Nuke* properties, add Tamp.Core plus one package per wrapper family the build uses; keep everything else."
  secret-field: "`[Secret] [Parameter] readonly string X;` -> `[Secret] readonly Secret X;`; uses that need the value become `X.Reveal()` (marked)."
  from-path: "`[PathExecutable] readonly Tool X;` -> `[FromPath(\"<name>\")] readonly Tool X;`; name = the attribute's argument, else the field name lower-cased."
  components-namespace: "Map `Nuke.Components.<I>` to `Tamp.Components.<I>` for the interfaces Tamp.Components ships; others are marked."

namespaces:
  Nuke.Common: Tamp
  Nuke.Common.IO: Tamp
  Nuke.Common.ProjectModel: Tamp
  Nuke.Common.Tooling: Tamp
  Nuke.Common.Execution: Tamp

rules:
  # ---- boilerplate ----
  - id: boilerplate.base-class
    category: boilerplate
    tier: auto
    nuke: "class Build : NukeBuild"
    tamp: "class Build : TampBuild"
    match: { kind: base_type, names: [NukeBuild] }
    rewrite: { kind: rename, to: TampBuild }
    verify: [Tamp.TampBuild]
  - id: boilerplate.entrypoint-default
    category: boilerplate
    tier: auto
    nuke: "public static int Main() => Execute<Build>(x => x.Default);"
    tamp: "public static int Main(string[] args) => Execute<Build>(args); + .Default() on the target"
    match: { kind: entrypoint }
    rewrite: { kind: handler, name: entrypoint-default }
    verify: [Tamp.ITargetDefinition.Default]
  - id: boilerplate.usings
    category: boilerplate
    tier: assisted
    nuke: "using Nuke.Common.*"
    tamp: "using Tamp; + per-tool using Tamp.<Family>.V<N>;"
    match: { kind: using, namespace: Nuke }
    rewrite: { kind: handler, name: usings }
    marker: "Check the generated usings; a Nuke namespace with no Tamp mapping was left in place."
  - id: boilerplate.bootstrap-scripts
    category: boilerplate
    tier: assisted
    nuke: "build.sh / build.cmd / build.ps1 / .nuke/"
    tamp: "tamp.sh / tamp.cmd (the `tamp init` scaffold)"
    match: { kind: file, globs: [build.sh, build.cmd, build.ps1, ".nuke/**"] }
    rewrite: { kind: handler, name: scaffold-bootstrap }
    marker: "Port any custom steps from NUKE's bootstrap scripts, then delete them and .nuke/."
  - id: boilerplate.configuration-class
    category: boilerplate
    tier: assisted
    nuke: "class Configuration : Enumeration { Debug, Release } (the nuke :setup template's build/Configuration.cs)"
    tamp: "Tamp.Configuration, built in (Debug / Release)"
    match: { kind: base_type, names: [Enumeration] }
    rewrite: { kind: handler, name: configuration-class }
    marker: "Configuration is now Tamp's built-in enum, not NUKE's string-like class. It works as a parameter and in SetConfiguration; where it was used as a string (a path segment, string concatenation), write Configuration.ToString()."
    verify: [Tamp.Configuration.Debug, Tamp.Configuration.Release]
  - id: boilerplate.build-project
    category: boilerplate
    tier: assisted
    nuke: "build/_build.csproj (Nuke.Common, PackageDownload tools)"
    tamp: "the same project, referencing Tamp.Core and the Tamp wrapper packages the build uses"
    match: { kind: file, globs: ["build/*.csproj"] }
    rewrite: { kind: handler, name: build-project }
    marker: "Review the rewritten build project. Nuke.* references are gone, and so is anything NUKE brought in transitively (Microsoft.Build, for one): add a PackageReference for any of it the build uses. A PackageDownload tool becomes a [NuGetPackage(\"<id>\", Version = \"<v>\")] Tool field in Tamp."
  - id: boilerplate.lifecycle-hooks
    category: boilerplate
    tier: manual
    nuke: "protected override void OnBuildInitialized() (and OnBuildCreated / OnBuildFinished / OnTarget*)"
    tamp: null
    match: { kind: member, names: [OnBuildCreated, OnBuildInitialized, OnBuildFinished, OnTargetRunning, OnTargetSucceeded, OnTargetFailed, OnTargetSkipped] }
    marker: "TampBuild has no lifecycle hooks. Move this into a target the others DependsOn (or that runs first with .Before(...)), or into the build class's constructor."
  - id: boilerplate.configure-delegate
    category: boilerplate
    tier: manual
    nuke: "Configure<DotNetPackSettings> PackSettings => _ => _.SetX(...)"
    tamp: null
    match: { kind: identifier, names: [Configure] }
    marker: "NUKE's Configure<T> settings delegate has no Tamp type. Inline the setters into the DotNet.X(s => ...) call, or keep a helper method that takes and returns Tamp's settings type."
  - id: boilerplate.ci-generation
    category: boilerplate
    tier: manual
    nuke: "[GitHubActions(...)] / [AzurePipelines(...)] / [AppVeyor(...)] / [TeamCity(...)] / [GitLab(...)]"
    tamp: null
    match: { kind: attribute, names: [GitHubActions, AzurePipelines, AppVeyor, TeamCity, GitLab, SpaceAutomation] }
    marker: "Tamp doesn't generate CI configuration. Keep the existing pipeline file, point it at ./tamp.sh, then delete this attribute."
  - id: boilerplate.build-attributes
    category: boilerplate
    tier: manual
    nuke: "[UnsetVisualStudioEnvironmentVariables] and similar build attributes"
    tamp: null
    match: { kind: attribute, names: [UnsetVisualStudioEnvironmentVariables, ShutdownDotNetAfterServerBuild, DotNetVerbosityMapping] }
    marker: "No Tamp equivalent; usually unnecessary. Delete it, or port what it did into a target."

  # ---- injection ----
  - id: injection.parameter
    category: injection
    tier: auto
    nuke: "[Parameter] readonly string Foo;"
    tamp: "[Parameter] readonly string Foo;"
    match: { kind: attribute, names: [Parameter] }
    rewrite: { kind: keep }
    verify: [Tamp.ParameterAttribute]
  - id: injection.solution
    category: injection
    tier: auto
    nuke: "[Solution] readonly Solution Solution;"
    tamp: "[Solution] readonly Solution Solution;"
    match: { kind: attribute, names: [Solution] }
    rewrite: { kind: keep }
    verify: [Tamp.SolutionAttribute]
  - id: injection.secret
    category: injection
    tier: assisted
    nuke: "[Secret] [Parameter] readonly string Token;"
    tamp: "[Secret] readonly Secret Token;"
    match: { kind: attribute, names: [Secret] }
    rewrite: { kind: handler, name: secret-field }
    marker: "The field is now a Secret: pass it where a Secret is accepted, or call .Reveal() where the plain value is needed (TAMP004)."
    verify: [Tamp.SecretAttribute, Tamp.Secret.Reveal]
  - id: injection.path-executable
    category: injection
    tier: auto
    nuke: "[PathExecutable] / [PathVariable] readonly Tool Git;"
    tamp: "[FromPath(\"git\")] readonly Tool Git;"
    match: { kind: attribute, names: [PathExecutable, PathVariable] }
    rewrite: { kind: handler, name: from-path }
    verify: [Tamp.FromPathAttribute, Tamp.Tool]
  - id: injection.tool-invocation
    category: injection
    tier: assisted
    nuke: "Git(\"status --short\")"
    tamp: "Git.Plan(\"status\", \"--short\") (a CommandPlan the target runs)"
    match: { kind: field_invocation, attributes: [PathExecutable, PathVariable] }
    rewrite: { kind: template, to: "{receiver}.Plan({args})" }
    marker: "NUKE parsed one argument string; Plan takes one argument per element. Split it, and return or run the CommandPlan (TAMP001)."
    verify: [Tamp.Tool.Plan]
  - id: injection.gitversion
    category: injection
    tier: assisted
    nuke: "[GitVersion] readonly GitVersion GitVersion;"
    tamp: "GitVersion.Run(s => ...) from Tamp.GitVersion.V6"
    match: { kind: attribute, names: [GitVersion] }
    marker: "Add Tamp.GitVersion.V6 and call GitVersion.Run in the target that needs the version, instead of an injected field."
  - id: injection.git-repository
    category: injection
    tier: assisted
    nuke: "[GitRepository] readonly GitRepository Repository;"
    tamp: "[GitRepository] readonly GitRepository Repository;"
    match: { kind: attribute, names: [GitRepository] }
    rewrite: { kind: keep }
    marker: "Tamp's GitRepository has Branch, Commit, RemoteUrl and IsDetachedHead. NUKE members such as Tags, IsOnMainOrMasterBranch() or GetGitHubOwner() aren't there: read them with git ([FromPath(\"git\")] Tool) or Tamp.GitHubCli.V2."
    verify: [Tamp.GitRepositoryAttribute, Tamp.GitRepository.Branch, Tamp.GitRepository.Commit, Tamp.GitRepository.RemoteUrl]
  - id: injection.solution-all-projects
    category: injection
    tier: auto
    nuke: "Solution.AllProjects"
    tamp: "Solution.Projects (every project, solution folders included)"
    match: { kind: member, names: [AllProjects] }
    rewrite: { kind: rename, to: Projects }
    verify: [Tamp.Solution.Projects]
  - id: injection.is-local-build
    category: injection
    tier: auto
    nuke: "IsLocalBuild / IsServerBuild"
    tamp: "IsLocalBuild / IsServerBuild"
    match: { kind: identifier, names: [IsLocalBuild, IsServerBuild] }
    rewrite: { kind: keep }
    verify: [Tamp.TampBuild.IsLocalBuild, Tamp.TampBuild.IsServerBuild]
  - id: injection.host
    category: injection
    tier: assisted
    nuke: "Host is GitHubActions / GitHubActions.Instance"
    tamp: "CiHost.Detect()"
    match: { kind: identifier, names: [Host] }
    marker: "Detect the CI host with CiHost.Detect() (null when local) instead of NUKE's Host."
    verify: [Tamp.CiHost.Detect]

  # ---- paths & filesystem ----
  - id: paths.root-directory
    category: paths
    tier: auto
    nuke: "RootDirectory"
    tamp: "RootDirectory"
    match: { kind: identifier, names: [RootDirectory] }
    rewrite: { kind: keep }
    verify: [Tamp.TampBuild.RootDirectory]
  - id: paths.temporary-directory
    category: paths
    tier: auto
    nuke: "TemporaryDirectory"
    tamp: "TemporaryDirectory"
    match: { kind: identifier, names: [TemporaryDirectory] }
    rewrite: { kind: keep }
    verify: [Tamp.TampBuild.TemporaryDirectory]
  - id: paths.absolute-path
    category: paths
    tier: auto
    nuke: "AbsolutePath, dir / \"sub\" / \"file.txt\""
    tamp: "AbsolutePath, dir / \"sub\" / \"file.txt\""
    match: { kind: identifier, names: [AbsolutePath] }
    rewrite: { kind: keep }
    verify: [Tamp.AbsolutePath]
  - id: paths.glob
    category: paths
    tier: auto
    nuke: "path.GlobFiles(...) / path.GlobDirectories(...)"
    tamp: "path.GlobFiles(...) / path.GlobDirectories(...)"
    match: { kind: invocation, names: [GlobFiles, GlobDirectories] }
    rewrite: { kind: keep }
    verify: [Tamp.AbsolutePath.GlobFiles, Tamp.AbsolutePath.GlobDirectories]
  - id: paths.create-directory
    category: paths
    tier: auto
    nuke: "path.CreateDirectory()"
    tamp: "path.CreateDirectory()"
    match: { kind: invocation, names: [CreateDirectory] }
    rewrite: { kind: keep }
    verify: [Tamp.AbsolutePath.CreateDirectory]
  - id: paths.create-or-clean-directory
    category: paths
    tier: auto
    nuke: "path.CreateOrCleanDirectory()"
    tamp: "path.DeleteDirectory().CreateDirectory()"
    match: { kind: invocation, names: [CreateOrCleanDirectory] }
    rewrite: { kind: template, to: "{receiver}.DeleteDirectory().CreateDirectory()" }
    verify: [Tamp.AbsolutePath.DeleteDirectory, Tamp.AbsolutePath.CreateDirectory]
  - id: paths.delete
    category: paths
    tier: auto
    nuke: "path.DeleteDirectory() / path.DeleteFile()"
    tamp: "path.DeleteDirectory() / path.DeleteFile()"
    match: { kind: invocation, names: [DeleteDirectory, DeleteFile] }
    rewrite: { kind: keep }
    verify: [Tamp.AbsolutePath.DeleteDirectory, Tamp.AbsolutePath.DeleteFile]
  - id: paths.touch
    category: paths
    tier: auto
    nuke: "path.TouchFile()"
    tamp: "path.Touch()"
    match: { kind: invocation, names: [TouchFile] }
    rewrite: { kind: rename, to: Touch }
    verify: [Tamp.AbsolutePath.Touch]
  - id: paths.read-write
    category: paths
    tier: auto
    nuke: "path.ReadAllText() / WriteAllText(...) / ReadAllLines() / WriteAllLines(...) / ReadAllBytes() / WriteAllBytes(...)"
    tamp: "the same methods on AbsolutePath"
    match: { kind: invocation, names: [ReadAllText, WriteAllText, ReadAllLines, WriteAllLines, ReadAllBytes, WriteAllBytes] }
    rewrite: { kind: keep }
    verify: [Tamp.AbsolutePath.ReadAllText, Tamp.AbsolutePath.WriteAllText, Tamp.AbsolutePath.ReadAllLines, Tamp.AbsolutePath.WriteAllLines, Tamp.AbsolutePath.ReadAllBytes, Tamp.AbsolutePath.WriteAllBytes]
  - id: paths.copy
    category: paths
    tier: assisted
    nuke: "path.Copy(target, policy)"
    tamp: "path.CopyTo(target, overwrite)"
    match: { kind: invocation, names: [Copy] }
    rewrite: { kind: rename, to: CopyTo }
    marker: "NUKE's ExistsPolicy becomes a bool overwrite (default false)."
    verify: [Tamp.AbsolutePath.CopyTo]
  - id: paths.move
    category: paths
    tier: assisted
    nuke: "path.Move(target, policy)"
    tamp: "path.MoveTo(target, overwrite)"
    match: { kind: invocation, names: [Move] }
    rewrite: { kind: rename, to: MoveTo }
    marker: "NUKE's ExistsPolicy becomes a bool overwrite (default false)."
    verify: [Tamp.AbsolutePath.MoveTo]
  - id: paths.copy-to-directory
    category: paths
    tier: assisted
    nuke: "file.CopyToDirectory(dir, policy)"
    tamp: "file.CopyToDirectory(dir, overwrite)"
    match: { kind: invocation, names: [CopyToDirectory] }
    rewrite: { kind: keep }
    marker: "Tamp's CopyToDirectory copies files only, and overwrite defaults to true."
    verify: [Tamp.AbsolutePath.CopyToDirectory]

  # ---- target DSL ----
  - id: target_dsl.target
    category: target_dsl
    tier: auto
    nuke: "Target Foo => _ => _ ..."
    tamp: "Target Foo => _ => _ ..."
    match: { kind: identifier, names: [Target] }
    rewrite: { kind: keep }
    verify: [Tamp.Target]
  - id: target_dsl.depends-on
    category: target_dsl
    tier: auto
    nuke: ".DependsOn(X, Y)"
    tamp: ".DependsOn(X, Y)"
    match: { kind: invocation, names: [DependsOn] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.DependsOn]
  - id: target_dsl.ordering
    category: target_dsl
    tier: auto
    nuke: ".Before(X) / .After(X)"
    tamp: ".Before(X) / .After(X)"
    match: { kind: invocation, names: [Before, After] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.Before, Tamp.ITargetDefinition.After]
  - id: target_dsl.triggers
    category: target_dsl
    tier: auto
    nuke: ".Triggers(X) / .TriggeredBy(X)"
    tamp: ".Triggers(X) / .TriggeredBy(X)"
    match: { kind: invocation, names: [Triggers, TriggeredBy] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.Triggers, Tamp.ITargetDefinition.TriggeredBy]
  - id: target_dsl.executes
    category: target_dsl
    tier: auto
    nuke: ".Executes(() => { ... })"
    tamp: ".Executes(() => { ... })"
    match: { kind: invocation, names: [Executes] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.Executes]
  - id: target_dsl.description
    category: target_dsl
    tier: auto
    nuke: ".Description(\"...\")"
    tamp: ".Description(\"...\")"
    match: { kind: invocation, names: [Description] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.Description]
  - id: target_dsl.produces
    category: target_dsl
    tier: auto
    nuke: ".Produces(ArtifactsDirectory / \"*.nupkg\")"
    tamp: ".Produces(ArtifactsDirectory / \"*.nupkg\")"
    match: { kind: invocation, names: [Produces] }
    rewrite: { kind: keep }
    note: "Tamp's Produces takes one glob; chain a call per pattern."
    verify: [Tamp.ITargetDefinition.Produces]
  - id: target_dsl.assured-after-failure
    category: target_dsl
    tier: auto
    nuke: ".AssuredAfterFailure()"
    tamp: ".AssuredAfterFailure()"
    match: { kind: invocation, names: [AssuredAfterFailure] }
    rewrite: { kind: keep }
    verify: [Tamp.ITargetDefinition.AssuredAfterFailure]
  - id: target_dsl.only-when
    category: target_dsl
    tier: assisted
    nuke: ".OnlyWhenStatic(() => c) / .OnlyWhenDynamic(() => c)"
    tamp: ".OnlyWhen(() => c)"
    match: { kind: invocation, names: [OnlyWhenStatic, OnlyWhenDynamic] }
    rewrite: { kind: rename, to: OnlyWhen }
    marker: "Tamp evaluates OnlyWhen once, when the target is reached; NUKE's static/dynamic distinction is gone. Several conditions: one OnlyWhen per condition."
    verify: [Tamp.ITargetDefinition.OnlyWhen]
  - id: target_dsl.requires
    category: target_dsl
    tier: assisted
    nuke: ".Requires(() => Field)"
    tamp: ".Requires(() => Field != null)"
    match: { kind: invocation, names: [Requires] }
    rewrite: { kind: keep }
    marker: "NUKE's Requires(() => Field) means 'Field is set'; Tamp's takes a bool. Write the condition."
    verify: [Tamp.ITargetDefinition.Requires]
  - id: target_dsl.consumes
    category: target_dsl
    tier: assisted
    nuke: ".Consumes(X)"
    tamp: ".DependsOn(X) (+ .Produces on X)"
    match: { kind: invocation, names: [Consumes] }
    marker: "Tamp's Consumes(Resource, ConsumeMode) is a concurrency resource, not an artifact dependency. Use DependsOn(X) and declare the files with Produces on X."
    verify: [Tamp.ITargetDefinition.DependsOn, Tamp.ITargetDefinition.Produces]
  - id: target_dsl.proceed-after-failure
    category: target_dsl
    tier: assisted
    nuke: ".ProceedAfterFailure()"
    tamp: ".FailureMode(FailureMode.Continue)"
    match: { kind: invocation, names: [ProceedAfterFailure] }
    rewrite: { kind: template, to: "{receiver}.FailureMode(FailureMode.Continue)" }
    marker: "Continue runs the remaining work but the build still fails (#4); NUKE's ProceedAfterFailure did not fail it."
    verify: [Tamp.ITargetDefinition.FailureMode, Tamp.FailureMode.Continue]
  - id: target_dsl.unlisted
    category: target_dsl
    tier: assisted
    nuke: ".Unlisted()"
    tamp: ".Internal()"
    match: { kind: invocation, names: [Unlisted] }
    rewrite: { kind: rename, to: Internal }
    marker: "Internal also blocks invoking the target directly from the CLI; NUKE's Unlisted only hid it."
    verify: [Tamp.ITargetDefinition.Internal]
  - id: target_dsl.partition
    category: target_dsl
    tier: manual
    nuke: "[Partition(n)] / .Partition(...)"
    tamp: null
    match: { kind: attribute, names: [Partition] }
    marker: "No Tamp equivalent for partitioned parallelism. Run serially, or shard outside Tamp."
  - id: target_dsl.partition-call
    category: target_dsl
    tier: manual
    nuke: ".Partition(...)"
    tamp: null
    match: { kind: invocation, names: [Partition] }
    marker: "No Tamp equivalent for partitioned parallelism. Run serially, or shard outside Tamp."
  - id: target_dsl.unmapped
    category: target_dsl
    tier: manual
    nuke: ".WhenSkipped(...) / .DependentFor(...) / .TryDependsOn(...) / .TryBefore(...) / .TryAfter(...) / .TryTriggers(...)"
    tamp: null
    match: { kind: invocation, names: [WhenSkipped, DependentFor, TryDependsOn, TryBefore, TryAfter, TryTriggers, TryTriggeredBy] }
    marker: "No direct Tamp equivalent. Restate it with DependsOn / Before / After / TriggeredBy."

  # ---- logging ----
  - id: logging.serilog
    category: logging
    tier: assisted
    nuke: "Log.Information(\"Built {Project}\", p) / Log.Warning / Log.Error / Log.Debug / Log.Verbose"
    tamp: "Console.WriteLine($\"Built {p}\") / Console.Error.WriteLine(...)"
    match: { kind: invocation, receiver: Log, names: [Verbose, Debug, Information, Warning, Error, Fatal] }
    marker: "Tamp captures each target's console output; there is no build Logger. Rewrite the Serilog template as an interpolated string; warnings and errors to Console.Error."

  # ---- components (ADR 0020) ----
  - id: components.interfaces
    category: components
    tier: assisted
    nuke: "class Build : NukeBuild, ICompile, ITest, IPack (Nuke.Components)"
    tamp: "class Build : TampBuild, ICompile, ITest, IPack (Tamp.Components)"
    match: { kind: using, namespace: Nuke.Components }
    rewrite: { kind: handler, name: components-namespace }
    marker: "Tamp.Components' interfaces mirror NUKE's but their members differ; check each overridden or configured member."
    verify: [Tamp.Components.IHazSolution, Tamp.Components.IHazConfiguration, Tamp.Components.IHazArtifacts, Tamp.Components.IRestore, Tamp.Components.ICompile, Tamp.Components.ITest, Tamp.Components.IPack]
  - id: components.unshipped
    category: components
    tier: manual
    nuke: "IPublish, IReportCoverage, IReportTestCount, ISignPackages, IHazGitVersion, IHazGitRepository, IHazChangelog, IHazNerdbankGitVersioning"
    tamp: null
    match: { kind: identifier, names: [IPublish, IReportCoverage, IReportTestCount, IReportIssues, ISignPackages, IHazGitVersion, IHazGitRepository, IHazChangelog, IHazNerdbankGitVersioning, IHazTwitterCredentials, IReportDuplicates] }
    marker: "Tamp.Components doesn't ship this component. Write its targets out on the build class."

tools:
  dotnet:
    id: tool.dotnet
    nuke_class: DotNetTasks
    nuke_namespace: Nuke.Common.Tools.DotNet
    package: Tamp.NetCli.V{N}
    package_majors: [8, 9, 10]
    namespace: Tamp.NetCli.V{N}
