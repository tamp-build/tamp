gaps:
  no_wrapper:            # no Tamp.<Family> package -> manual (raw ProcessRunner / [FromPath] Tool)
    - { id: gap.powershell, nuke: [PowerShellTasks], workaround: "[FromPath(\"pwsh\")] Tool / ProcessRunner", priority: high }
    - { id: gap.git, nuke: [GitTasks], workaround: "[FromPath(\"git\")] Tool; some facts via Tamp.GitHubCli.V2", priority: high }
    - { id: gap.paket, nuke: [PaketTasks], workaround: "raw Tool", priority: med }
    - { id: gap.gitreleasemanager, nuke: [GitReleaseManagerTasks], workaround: "raw Tool / gh release", priority: med }
    - { id: gap.resharper-clt, nuke: [InspectCodeTasks, CleanupCodeTasks, DupFinderTasks], workaround: "raw Tool / Tamp.SonarScanner", priority: med }
    - { id: gap.slack, nuke: [SlackTasks], workaround: "custom IBuildReporter / webhook (Tamp ships Telegram)", priority: med }
    - { id: gap.azure-keyvault, nuke: [AzureKeyVaultTasks], workaround: "Secret injection / Tamp.AzureCli.V2", priority: med }
    - { id: gap.dotcover, nuke: [DotCoverTasks], workaround: "reshape to Tamp.Coverlet.V6", priority: low }
    - { id: gap.chocolatey, nuke: [ChocolateyTasks], workaround: "raw Tool", priority: low }
    - { id: gap.innosetup, nuke: [InnoSetupTasks], workaround: "raw Tool", priority: low }
    - { id: gap.ilmerge, nuke: [ILRepackTasks, ILMergeTasks], workaround: "raw Tool", priority: low }
    - { id: gap.octopus, nuke: [OctopusTasks], workaround: "raw Tool", priority: low }
    - { id: gap.coverage-upload, nuke: [CodecovTasks, CoverallsNetTasks], workaround: "Tamp.Ingest.V1 / raw Tool", priority: low }
  covered_differently:   # convertible, but reshape (not 1:1)
    - { id: gap.test-runners, nuke: [Xunit2Tasks, NUnitTasks, MSTestTasks, VSTestTasks], tamp: "DotNet.Test", note: "runs via dotnet test, not per-framework console runners" }
    - { id: gap.nuget-exe, nuke: [NuGetTasks], tamp: "DotNet.Pack / DotNet.NuGetPush / DotNet.Restore", note: "SDK path unless nuget.exe specifically needed" }
  framework_features:    # not tools
    - { id: gap.partition, feature: "[Partition] / partitioned parallelism", status: none, note: "biggest hard gap; run serially or shard outside Tamp (target_dsl.partition)" }
    - { id: gap.git-repository, feature: "[GitRepository] injection", status: covered, tamp: "[GitRepository] (Branch / Commit / RemoteUrl)", note: "NUKE's richer members aren't there (injection.git-repository)" }
    - { id: gap.ci-generation, feature: "CI configuration generation ([GitHubActions] etc.)", status: none, note: "keep the existing pipeline file (boilerplate.ci-generation)" }
    - { id: gap.components, feature: "Nuke.Components", status: covered, tamp: "Tamp.Components (ADR 0020)", note: "IHazSolution/IHazConfiguration/IHazArtifacts/IRestore/ICompile/ITest/IPack ship; the rest are components.unshipped" }
    - { id: gap.logging, feature: "Serilog Log.*", status: covered, tamp: "per-target captured console output", note: "logging.serilog" }
    - { id: gap.setup-wizard, feature: "nuke :setup wizard", status: covered, tamp: "tamp init (non-interactive)" }

manual:
  - "NUKE verbs beyond a Tamp wrapper's surface -> raw call or extend the wrapper"
  - "arbitrary custom C# in Executes bodies -> carries over except NUKE-API calls (mapped above)"
