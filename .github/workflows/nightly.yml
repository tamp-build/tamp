name: Nightly Findings Ingest

# Overnight full-evidence ingest to tamp-findings: re-runs the build, tests + cross-OS
# coverage, SBOM, SAST, secrets, and ADR conformance, then pushes it all to findings.
# Re-posting the SBOM nightly is what surfaces NEW CVEs in unchanged dependencies and
# SBOM staleness — findings re-evaluates against the current advisory data each time.
# Ends with a (non-failing) ship-gate report so the dashboard reflects HEAD every morning.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC ≈ 02:00–03:00 America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  FINDINGS_URL: https://tamp-findings.brewingcoder.com

jobs:
  # Cross-OS coverage + test results: OS-specific code (Windows CredRead, macOS Keychain,
  # Linux secret-tool) only executes on its own leg, so coverage is merged across all three.
  evidence:
    name: build & coverage (${{ matrix.os }})
    if: github.repository == 'tamp-build/tamp'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Tamp.slnx
      - name: Build
        run: dotnet build Tamp.slnx --no-restore --configuration Release
      - name: Test + coverage
        run: dotnet test Tamp.slnx --no-build --configuration Release --logger trx --results-directory ./TestResults --collect "XPlat Code Coverage" --settings build/coverlet.runsettings
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: ./TestResults/**/coverage.opencover.xml
          if-no-files-found: warn
      - name: Upload trx
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

  ingest:
    name: full ingest → findings
    needs: evidence
    if: github.repository == 'tamp-build/tamp'
    runs-on: ubuntu-latest
    env:
      FINDINGS_TOKEN: ${{ secrets.FINDINGS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVIDENCE_DIR: ${{ github.workspace }}/artifacts/evidence
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Guard — require FINDINGS_TOKEN
        run: |
          if [ -z "$FINDINGS_TOKEN" ]; then
            echo "::warning::FINDINGS_TOKEN secret not set — skipping ingest."; echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Restore
        if: env.SKIP != '1'
        run: dotnet restore Tamp.slnx

      - name: Build (for conformance source scan)
        if: env.SKIP != '1'
        run: dotnet build Tamp.slnx --no-restore --configuration Release

      - name: Stage test results (all OS legs)
        if: env.SKIP != '1'
        uses: actions/download-artifact@v6
        with:
          pattern: trx-*
          path: ./_trx
      - name: Stage coverage (all OS legs)
        if: env.SKIP != '1'
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: ./_cov

      - name: Assemble evidence (merge cross-OS coverage + collect trx)
        if: env.SKIP != '1'
        run: |
          set -e
          mkdir -p "$EVIDENCE_DIR/trx" "$EVIDENCE_DIR/coverage"
          find ./_trx -name '*.trx' -exec cp {} "$EVIDENCE_DIR/trx/" \;
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:./_cov/**/coverage.opencover.xml" "-targetdir:$EVIDENCE_DIR/coverage" "-reporttypes:Cobertura"

      - name: SBOM (CycloneDX)
        if: env.SKIP != '1'
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Tamp.slnx -o "$EVIDENCE_DIR" -fn sbom.cdx.json -F Json

      # SCA: scan the SBOM for CVEs. The ingest tool posts the results + a Grype scan-run
      # receipt (DB provenance in Notes) so "0 CVEs" means "scanned clean" not "never scanned".
      - name: SCA (grype against SBOM, best-effort)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          GRYPE_VERSION: '0.119.0'
        run: |
          set -uo pipefail
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          # Download to the asset's real filename so `sha256sum -c` (which reads the name from the
          # checksums file) can find it — saving as grype.tar.gz made verify fail every run and
          # silently skip SCA. Anchor the grep to the exact filename so only the tarball line is checked.
          if curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 -o "$tarball" "${base}/${tarball}" \
             && curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 -o grype_checksums.txt "${base}/grype_${GRYPE_VERSION}_checksums.txt" \
             && grep " ${tarball}\$" grype_checksums.txt | sha256sum -c - \
             && tar -xzf "$tarball" grype; then
            ./grype "sbom:$EVIDENCE_DIR/sbom.cdx.json" -o json --file "$EVIDENCE_DIR/grype.json" || echo "grype scan non-zero — continuing"
          else
            echo "grype download/verify failed — skipping SCA"
          fi

      # Pinned version + HTTPS-only + SHA256 verify — never execute an unverified binary.
      - name: SAST (opengrep, best-effort)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          OPENGREP_VERSION: '1.30.0'
          OPENGREP_SHA256: '35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c'
        run: |
          set -uo pipefail
          if curl --proto '=https' --tlsv1.2 -fsSL -o opengrep "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" \
             && echo "${OPENGREP_SHA256}  opengrep" | sha256sum -c -; then
            chmod +x opengrep
            ./opengrep scan --config auto --sarif --output "$EVIDENCE_DIR/opengrep.sarif" . || echo "opengrep scan non-zero — continuing"
          else
            echo "opengrep download/verify failed — skipping SAST"
          fi

      - name: Secrets (trufflehog — fails the job on VERIFIED secrets)
        if: env.SKIP != '1'
        env:
          TRUFFLEHOG_VERSION: '3.97.9'
        run: |
          set -uo pipefail
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          if curl --proto '=https' --tlsv1.2 -fsSL -o th.tar.gz "${base}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
             && curl --proto '=https' --tlsv1.2 -fsSL -o th_checksums.txt "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" \
             && grep 'linux_amd64.tar.gz' th_checksums.txt | sha256sum -c - \
             && tar -xzf th.tar.gz trufflehog; then
            ./trufflehog filesystem . --json --no-update > "$EVIDENCE_DIR/trufflehog.json" 2>/dev/null || true
            if grep -q '"Verified":true' "$EVIDENCE_DIR/trufflehog.json" 2>/dev/null; then
              echo "::error::trufflehog found VERIFIED secrets"; exit 1
            fi
          else
            echo "trufflehog download/verify failed — skipping secrets scan"
          fi

      - name: Resolve version
        if: env.SKIP != '1'
        run: |
          # Per-build version: base + short commit sha. Each nightly runs against a different main
          # HEAD but Directory.Build.props Version is stale between releases, so the base alone would
          # make distinct commits share a version — and findings' BuildResolver version-fallback would
          # then conflate them if a commit-sha match ever misses. Commit-sha is the real key; the
          # +<sha> suffix keeps the version attribute unique per build too. (Releases keep the clean
          # tag version — one commit per tag, no ambiguity.)
          BASE=$(grep -oE '<Version>[^<]+' Directory.Build.props | head -1 | sed 's/<Version>//')
          BASE=${BASE:-0.0.0}
          SHORT=$(git rev-parse --short=7 HEAD)
          echo "TAMP_VERSION=${BASE}+${SHORT}" >> "$GITHUB_ENV"

      - name: Ingest → findings
        if: env.SKIP != '1'
        env:
          TAMP_COMMIT: ${{ github.sha }}
          TAMP_BRANCH: ${{ github.ref_name }}
          REPO_ROOT: ${{ github.workspace }}
        run: dotnet run --project tools/findings-ingest/FindingsIngest.csproj -c Release -- ingest

      - name: Ship-gate report (non-failing)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          TAMP_COMMIT: ${{ github.sha }}
        run: dotnet run --project tools/findings-ingest/FindingsIngest.csproj -c Release -- gate
