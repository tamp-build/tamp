name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify SDKs
        shell: bash
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tamp.slnx

      - name: Build
        run: dotnet build Tamp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tamp.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults --collect "XPlat Code Coverage" --settings build/coverlet.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

      # Per-OS coverage: OS-specific code (Windows CredRead, macOS Keychain, Linux
      # secret-tool) only executes on its own leg, so coverage MUST be merged across
      # all three legs (see the coverage job) to reflect true cross-OS coverage.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: ./TestResults/**/coverage.opencover.xml
          if-no-files-found: warn

  coverage:
    name: coverage (cross-OS merge)
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download coverage artifacts (all OS legs)
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: ./coverage-in

      - name: Merge cross-OS coverage
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Merge every OS leg's opencover into one Cobertura + text summary. OS-specific
          # stores are only covered on their own leg; merging unions those hits.
          reportgenerator \
            "-reports:./coverage-in/**/coverage.opencover.xml" \
            "-targetdir:./coverage-report" \
            "-reporttypes:Cobertura;TextSummary;Html"
          echo '### Cross-OS coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,20p' ./coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: ./coverage-report/**
          if-no-files-found: warn

  pack:
    name: pack (release artifacts)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tamp.slnx

      - name: Pack (default)
        run: dotnet pack Tamp.slnx --no-restore --configuration Release --output ./artifacts

      # The Cli project ships two NuGet packages from the same code:
      #   - Tamp.Cli   (command "tamp"        — NUKE-style)
      #   - dotnet-tamp (command "dotnet-tamp" — Cake-style)
      # The default pack above produces Tamp.Cli; this second pack
      # rebuilds just the Cli project under the DotnetVerb flavor.
      - name: Pack Cli (dotnet-verb flavor)
        run: dotnet pack src/Tamp.Cli/Tamp.Cli.csproj --configuration Release --output ./artifacts -p:CliFlavor=DotnetVerb

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error
