name: Release

# Publishes Tamp packages to nuget.org via trusted publishing
# (OIDC). The nuget.org policy is scoped to this exact workflow
# file under tamp-build/tamp; rename or move it and the policy
# stops trusting requests.

on:
  # Tag-driven release: pushing a v* tag triggers a real publish.
  # The tag name (minus leading "v") is passed to dotnet pack as the
  # canonical version, overriding whatever's in csproj — the tag is
  # the source of truth for shipped versions.
  push:
    tags:
      - 'v*'

  # Manual override. Defaults to dry_run=true so an accidental click
  # never publishes; flip to false to force a manual publish (e.g.,
  # the pre-launch land-grab pattern).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, pack + login but do NOT push to nuget.org'
        type: boolean
        default: true
      skip_findings_gate:
        description: 'Emergency override: skip the tamp-findings ship gate (publish even if blocked)'
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for nuget.org trusted publishing
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  # Dogfood our own strict risk policy: build fresh evidence at the tag commit,
  # push it to tamp-findings, and BLOCK the publish unless the ship gate is clear
  # (0 blocking gates). Overridable on manual dispatch via skip_findings_gate.
  findings-gate:
    name: tamp-findings ship gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.skip_findings_gate == false }}
    env:
      DOTNET_NOLOGO: '1'
      FINDINGS_URL: https://tamp-findings.brewingcoder.com
      FINDINGS_TOKEN: ${{ secrets.FINDINGS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVIDENCE_DIR: ${{ github.workspace }}/artifacts/evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard — require FINDINGS_TOKEN
        run: |
          if [ -z "$FINDINGS_TOKEN" ]; then
            echo "::error::FINDINGS_TOKEN secret not set — cannot run the release gate. Set it or dispatch with skip_findings_gate=true."
            exit 1
          fi

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version from tag
        if: github.event_name == 'push'
        run: echo "TAMP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore + build
        run: |
          dotnet restore Tamp.slnx
          dotnet build Tamp.slnx --no-restore --configuration Release

      - name: Test + coverage
        run: |
          mkdir -p "$EVIDENCE_DIR/trx" "$EVIDENCE_DIR/coverage"
          dotnet test Tamp.slnx --no-build --configuration Release --logger trx --results-directory "$EVIDENCE_DIR/trx" --collect "XPlat Code Coverage" --settings build/coverlet.runsettings
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:$EVIDENCE_DIR/trx/**/coverage.opencover.xml" "-targetdir:$EVIDENCE_DIR/coverage" "-reporttypes:Cobertura"

      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Tamp.slnx -o "$EVIDENCE_DIR" -fn sbom.cdx.json -F Json

      # Pinned version + HTTPS-only + SHA256 verify — never execute an unverified binary.
      - name: SAST (opengrep, best-effort)
        continue-on-error: true
        env:
          OPENGREP_VERSION: '1.30.0'
          OPENGREP_SHA256: '35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c'
        run: |
          set -uo pipefail
          if curl --proto '=https' --tlsv1.2 -fsSL -o opengrep "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" \
             && echo "${OPENGREP_SHA256}  opengrep" | sha256sum -c -; then
            chmod +x opengrep
            ./opengrep scan --config auto --sarif --output "$EVIDENCE_DIR/opengrep.sarif" . || echo "opengrep scan non-zero — continuing"
          else
            echo "opengrep download/verify failed — skipping SAST"
          fi

      - name: Secrets (trufflehog — fails on VERIFIED secrets)
        env:
          TRUFFLEHOG_VERSION: '3.97.9'
        run: |
          set -uo pipefail
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          if curl --proto '=https' --tlsv1.2 -fsSL -o th.tar.gz "${base}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
             && curl --proto '=https' --tlsv1.2 -fsSL -o th_checksums.txt "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" \
             && grep 'linux_amd64.tar.gz' th_checksums.txt | sha256sum -c - \
             && tar -xzf th.tar.gz trufflehog; then
            ./trufflehog filesystem . --json --no-update > "$EVIDENCE_DIR/trufflehog.json" 2>/dev/null || true
            if grep -q '"Verified":true' "$EVIDENCE_DIR/trufflehog.json" 2>/dev/null; then
              echo "::error::trufflehog found VERIFIED secrets"; exit 1
            fi
          else
            echo "trufflehog download/verify failed — skipping secrets scan"
          fi

      - name: Ingest evidence → findings
        env:
          TAMP_COMMIT: ${{ github.sha }}
          TAMP_BRANCH: ${{ github.ref_name }}
          REPO_ROOT: ${{ github.workspace }}
        run: dotnet run --project tools/findings-ingest/FindingsIngest.csproj -c Release -- ingest

      - name: Ship gate (HARD — blocks release if not clear)
        env:
          TAMP_COMMIT: ${{ github.sha }}
        run: dotnet run --project tools/findings-ingest/FindingsIngest.csproj -c Release -- gate

  publish:
    name: pack + push to nuget.org
    needs: findings-gate
    # needs: is skipped cleanly when findings-gate is skipped (dispatch + skip_findings_gate=true),
    # but only if we don't hard-require success. Allow publish when the gate passed OR was intentionally skipped.
    if: ${{ always() && (needs.findings-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_findings_gate == true)) }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # source link wants the full history

      # Refuse to release a tag whose commit's CI hasn't passed (TAM-84 + branch protection).
      # Skipped on workflow_dispatch — that path is the manual override
      # for land-grabs / out-of-band publishes.
      - name: Wait for CI to pass on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          SHA="${{ github.sha }}"
          echo "Waiting for CI workflow run on commit $SHA"
          for i in $(seq 1 60); do
            result=$(gh run list --workflow CI --commit "$SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -z "$result" ]; then
              echo "  (no CI run for this commit yet — attempt $i/60, sleeping 10s)"
              sleep 10
              continue
            fi
            status=$(echo "$result" | jq -r '.status')
            conclusion=$(echo "$result" | jq -r '.conclusion // ""')
            echo "  CI status=$status conclusion=$conclusion (attempt $i/60)"
            if [ "$status" != "completed" ]; then
              echo "  (CI still running, sleeping 10s)"
              sleep 10
              continue
            fi
            if [ "$conclusion" = "success" ]; then
              echo "✓ CI passed on $SHA — proceeding with release"
              exit 0
            fi
            echo "::error::CI conclusion is '$conclusion' on commit $SHA. Refusing to release."
            exit 1
          done
          echo "::error::Timed out waiting for CI to complete on commit $SHA after 10 minutes."
          exit 1

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # On tag pushes, the tag is the source of truth for the version.
      # Strips the leading "v" (so v0.1.0 → 0.1.0) and exports
      # PACKAGE_VERSION for the pack steps to consume via -p:Version.
      # On workflow_dispatch, PACKAGE_VERSION is left empty and pack
      # uses whatever <Version> is set in each csproj.
      - name: Resolve version from tag
        if: github.event_name == 'push'
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Tamp.slnx

      # Default flavor packs everything packable in the solution:
      #   Tamp.Core, Tamp.Cli (bare command), Tamp.NetCli.V8/V9/V10,
      #   Tamp.DotNetCoverage.V18.
      # Third-party tool wrappers ship from satellite repos under the
      # tamp-build org (tamp-ef, tamp-docker, tamp-sonar, etc.).
      - name: Pack (default flavor)
        run: |
          version_arg=""
          if [ -n "$PACKAGE_VERSION" ]; then version_arg="-p:Version=$PACKAGE_VERSION"; fi
          dotnet pack Tamp.slnx --no-restore --configuration Release --output ./artifacts $version_arg

      # Cli ships a second nupkg with command name "dotnet-tamp" so
      # `dotnet tamp ci` works (Cake-style). Same code, different
      # PackageId + ToolCommandName via the CliFlavor MSBuild prop.
      - name: Pack Cli (dotnet-verb flavor)
        run: |
          version_arg=""
          if [ -n "$PACKAGE_VERSION" ]; then version_arg="-p:Version=$PACKAGE_VERSION"; fi
          dotnet pack src/Tamp.Cli/Tamp.Cli.csproj --configuration Release --output ./artifacts -p:CliFlavor=DotnetVerb $version_arg

      - name: List packages
        run: ls -la ./artifacts/

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: BrewingCoder

      # Push runs on tag push always, and on workflow_dispatch only
      # when dry_run is explicitly false.
      - name: Push packages
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          set -e
          for nupkg in ./artifacts/*.nupkg; do
            echo "::group::push $(basename "$nupkg")"
            dotnet nuget push "$nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
            echo "::endgroup::"
          done

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "DRY RUN — would have pushed:"
          ls -la ./artifacts/*.nupkg
          echo ""
          echo "Re-run with dry_run=false to actually publish."

      - name: Upload packages as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error
